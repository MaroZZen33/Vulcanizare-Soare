<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Social – Soare Business Târgoviște</title>
<style>
:root{--k:#111;--o:#F26B1D;--w:#fff;--y:#FFC400;--g:#34D186;--mut:#bdbdbd;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html{background:var(--k)}
body{background:var(--k);color:var(--w);font-family:Arial,Helvetica,sans-serif;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.hd{background:var(--w);padding:max(22px,env(safe-area-inset-top)) 20px 36px;border-bottom:5px solid var(--o);border-radius:0 0 50% 50% / 0 0 28px 28px}
.lg{display:block;width:min(270px,72%);height:auto;margin:0 auto}
main{padding:26px 20px 8px}
h1{font-family:"Arial Black",Arial,sans-serif;font-size:1.7rem;line-height:1.08;text-transform:uppercase}
.t{color:var(--y)}.b{color:var(--g)}
.sub{margin-top:10px;color:var(--mut);font-size:1rem}
.btns{display:grid;gap:14px;margin-top:24px}
.btn{display:block;background:var(--o);color:var(--k);text-decoration:none;font-family:"Arial Black",Arial,sans-serif;font-size:1.2rem;padding:18px 20px;border-radius:14px}
.btn small{display:block;font-family:Arial,sans-serif;font-weight:700;font-size:.9rem;margin-top:4px}
.btn.dk{background:#1f1f1f;color:var(--w);border:2px solid var(--o)}
.btn.dis{background:#1f1f1f;color:var(--mut);border:2px dashed #555}
a.btn:focus-visible,nav a:focus-visible{outline:3px solid var(--w);outline-offset:3px}
.pl{list-style:none;padding:0;margin-top:22px;background:var(--w);color:var(--k);border-radius:14px;padding:6px 16px}
.pl li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px dashed #cfcfcf;font-weight:700;font-size:.98rem}
.pl li:last-child{border:0}
.pl .pr{flex:none;font-family:"Arial Black",Arial,sans-serif;color:var(--o);white-space:nowrap}
.pl .pr.free{color:#12934f}
.note{margin-top:14px;color:var(--mut);font-size:.9rem}
.call{margin-top:18px}
.info{margin-top:26px;color:var(--mut);font-size:.95rem;line-height:1.5}
.info strong{color:var(--w)}
nav{display:flex;justify-content:center;gap:22px;margin-top:30px;padding:0 20px;font-weight:700;font-size:.95rem}
nav a{color:var(--o);text-decoration:none;padding:6px 2px}
nav a[aria-current="page"]{color:var(--w);border-bottom:2px solid var(--o)}
</style>
</head>
