<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cum ajungi la Soare – Vulcanizare Târgoviște</title>
<style>
:root{--bg:#FFC400;--fg:#161616;--card:#161616;--cardfg:#fff;--accent:#FFC400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#fff;--card:#FFC400;--cardfg:#161616;--accent:#FFC400}}
:root[data-theme="dark"]{--bg:#161616;--fg:#fff;--card:#FFC400;--cardfg:#161616;--accent:#FFC400}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;padding:28px 20px 36px;max-width:480px;margin:0 auto}
h1{font-family:"Arial Black",Arial,sans-serif;font-size:2rem;line-height:1.05;text-transform:uppercase}
p{margin-top:12px;font-size:1.05rem;font-weight:700}
.btns{display:grid;gap:14px;margin-top:28px}
a.b{display:block;background:var(--card);color:var(--cardfg);text-decoration:none;font-family:"Arial Black",Arial,sans-serif;font-size:1.25rem;padding:20px 22px;border-radius:14px}
a.b small{display:block;font-family:Arial,sans-serif;font-weight:400;font-size:.9rem;margin-top:4px;opacity:.85}
a.b:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.addr{margin-top:28px;font-size:.95rem;font-weight:400}
</style>
</head>
<body>
<h1>Cum ajungi la noi</h1>
<p>Vulcanizare &amp; Service SOARE, DN72, Târgoviște. Alege aplicația de navigație.</p>
<div class="btns">
  <a class="b" href="https://www.google.com/maps/dir//Vulcanizare+%26+Service+SOARE,+DN72,+T%C3%A2rgovi%C8%99te/data=!4m8!4m7!1m0!1m5!1m1!1s0x40b2f56f4d29db0b:0xde030f994e3d1240!2m2!1d25.4470244!2d44.9010527">Google Maps<small>Traseu până la atelier</small></a>
  <a class="b" href="https://waze.com/ul?ll=44.9010527,25.4470244&amp;navigate=yes">Waze<small>Pornește navigarea</small></a>
  <a class="b" href="https://maps.apple.com/?daddr=44.9010527,25.4470244&amp;dirflg=d">Apple Maps<small>Pentru iPhone</small></a>
</div>
<p class="addr">Program: duminică–vineri. Sâmbătă închis.</p>
</body>
</html>
